<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.png" />
    <title>Time Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">

      <!-- Navigace -->
      <div id="nav">
        <button class="nav-btn active" id="nav-tracker">Tracker</button>
        <button class="nav-btn" id="nav-summary">Přehled</button>
      </div>

      <!-- Obrazovka: Tracker -->
      <div id="screen-tracker">
        <div id="current-activity">
          <p id="current-name">Žádná aktivita</p>
          <p id="current-timer">00:00:00</p>
        </div>
        <div id="activity-list"></div>
        <div id="add-activity">
          <input type="text" id="new-activity-input" placeholder="Název aktivity..." />
          <button id="add-activity-btn">Přidat</button>
        </div>
      </div>

      <!-- Obrazovka: Přehled -->
      <div id="screen-summary" class="hidden">
        <h2 id="summary-title">Přehled dne</h2>
        <div id="summary-list"></div>
      </div>

    </div>
    <script src="app.js"></script>
  </body>
</html>
